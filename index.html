<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviAid Real-Eye AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { margin: 0; background: #000; color: #00FF00; font-family: sans-serif; text-align: center; }
        video { width: 100%; height: 70vh; object-fit: cover; }
        .vision-status { padding: 20px; font-size: 22px; color: #FFD700; background: #111; min-height: 100px; line-height: 1.5; }
        .live-indicator { position: absolute; top: 10px; right: 10px; color: red; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body onclick="startHumanEye()">

    <div class="live-indicator">● LIVE AI EYE</div>
    <video id="video" autoplay playsinline muted></video>
    <div class="vision-status" id="narrator">මනුස්ස ඇස පණගැන්වීමට ස්ක්‍රීන් එක ටැප් කරන්න. ඉන්පසු ෆෝන් එක ඉදිරියට හරවා තබාගන්න.</div>

    <script>
        let model;
        let lastAnnounced = "";

        // මනුස්ස ඇසක් වගේ හඳුනාගන්නා දේවල් (විශාල ලැයිස්තුවක්)
        const dictionary = {
            "person": "මිනිසෙක් ඉදිරියෙන් සිටී",
            "bicycle": "බයිසිකලයක්",
            "car": "වාහනයක් එනවා",
            "motorcycle": "මෝටර් සයිකලයක්",
            "bus": "බස් රථයක්",
            "truck": "ට්‍රක් රථයක්",
            "dog": "බල්ලෙක් ඉන්නවා",
            "tree": "ගස් කොළන් පෙනෙනවා",
            "bench": "වාඩි වෙන්න බංකුවක් තියෙනවා",
            "cell phone": "ජංගම දුරකථනයක්",
            "potted plant": "මල් පෝච්චියක් හෝ ගසක්",
            "chair": "පුටුවක්",
            "bed": "ඇඳක්",
            "tv": "ටීවී එකක්",
            "laptop": "ලැප්ටොප් එකක්"
            // මෙතනට AI එකෙන් එන ඕනෑම දෙයක් සිංහලට හැරවීමේ logic එකක් අපි දාමු
        };

        async function startHumanEye() {
            document.getElementById('narrator').innerText = "AI ඇස පූරණය වේ... රැඳී සිටින්න...";
            model = await cocoSsd.load();
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', focusMode: 'continuous' } 
            });
            document.getElementById('video').srcObject = stream;
            speak("මනුස්ස ඇස සක්‍රීයයි. මම දැන් ඔබ වෙනුවෙන් වටපිටාව නිරීක්ෂණය කරනවා.");
            autoScan();
        }

        function speak(text) {
            if (window.speechSynthesis.speaking) return;
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'si-LK';
            msg.rate = 0.9; // ටිකක් හෙමින් පැහැදිලිව කියන්න
            window.speechSynthesis.speak(msg);
            document.getElementById('narrator').innerText = text;
        }

        async function autoScan() {
            const predictions = await model.detect(document.getElementById('video'));
            
            if (predictions.length > 0) {
                let primaryObject = predictions[0].class;
                let description = dictionary[primaryObject] || primaryObject + " හඳුනාගත්තා";
                
                // එකම දේ නැවත නැවත කීම වැළැක්වීමට
                if (description !== lastAnnounced) {
                    speak(description);
                    lastAnnounced = description;
                }
            } else {
                // කිසිවක් නැති විට වටපිටාව ගැන පොදු විස්තරයක් (අනුමාන)
                // මේක තව දියුණු කළ යුතුයි
            }
            
            setTimeout(autoScan, 2000); // සෑම තත්පර 2කට වරක් ස්වයංක්‍රීයව බලයි
        }
    </script>
</body>
</html>
