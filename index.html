<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NaviAid Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { margin: 0; background: #000; color: #00FF00; font-family: sans-serif; text-align: center; overflow: hidden; }
        #v { width: 100%; height: 60vh; object-fit: cover; border-bottom: 4px solid #00FF00; }
        .ui-panel { padding: 15px; background: #111; min-height: 180px; }
        .status-txt { font-size: 24px; color: #FFD700; font-weight: bold; margin-bottom: 10px; }
        .nav-txt { font-size: 18px; color: #00ecff; border: 1px solid #333; padding: 5px; }
        .search-area { margin: 10px; }
        input { padding: 15px; border-radius: 5px; border: 2px solid #00FF00; background: #000; color: #fff; width: 70%; font-size: 18px; }
    </style>
</head>
<body onclick="startNaviAid()">

    <div class="search-area">
        <input type="text" id="destination" placeholder="යන්න ඕන තැන මෙතන ලියන්න...">
    </div>

    <video id="v" autoplay playsinline muted></video>
    
    <div class="ui-panel">
        <div id="out" class="status-txt">ඇරඹීමට ස්පර්ශ කරන්න. මම ඔබේ ඇස් වෙන්නම්.</div>
        <div id="nav" class="nav-txt">GPS සූදානම් වෙමින් පවතියි...</div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyDiow4Bz0XXXV15C-1zir2o3DsCJZHIwLU"; 
        let model;
        let lastNarration = "";
        let targetLocation = null;

        // සිංහලෙන් කතා කිරීමේ පද්ධතිය
        function talk(msg) {
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(msg);
            speech.lang = 'si-LK';
            speech.rate = 0.9;
            window.speechSynthesis.speak(speech);
            document.getElementById('out').innerText = msg;
        }

        async function startNaviAid() {
            if(model) return;
            talk("නැවී ඒඩ් පූර්ණ පද්ධතිය සක්‍රීයයි. මම දැන් ඔබේ ඇස් සහ මගපෙන්වන්නා ලෙස වැඩ කරනවා.");
            
            // 1. කැමරාව සහ බාධක හඳුනාගැනීම (TensorFlow)
            model = await cocoSsd.load();
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: 640, height: 480 } 
            });
            document.getElementById('v').srcObject = stream;
            
            // 2. GPS මගපෙන්වීම ආරම්භ කිරීම
            navigator.geolocation.watchPosition(updateNavigation, (err) => console.log(err), { enableHighAccuracy: true });
            
            // 3. Gemini AI මගින් වටපිටාව විස්තර කිරීම (සෑම තත්පර 12කට වරක්)
            setInterval(analyzeEnvironment, 12000);
            
            detectObstacles();
        }

        // Gemini AI හරහා වටපිටාව, සල්ලි සහ අකුරු කියවීම
        async function analyzeEnvironment() {
            const video = document.getElementById('v');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];

            const prompt = "ඔබ දෘශ්‍යාබාධිත සහායකයෙකි. කැමරාවෙන් පෙනෙන දේ සරල සිංහලෙන් පවසන්න. පාරේ බාධක, වංගු, මිනිසුන්ගේ ඉරියව්, සල්ලි කොළ හෝ පොත් වල අකුරු ඇත්නම් ඒවා විස්තර කරන්න. ඉතා කෙටි වාක්‍ය පාවිච්චි කරන්න.";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
                    })
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                talk(aiText);
            } catch (e) {
                console.error("AI Error:", e);
            }
        }

        // බාධක සඳහා වේගවත් අනතුරු ඇඟවීම (සෑම තත්පර 2කට වරක්)
        async function detectObstacles() {
            const predictions = await model.detect(document.getElementById('v'));
            if (predictions.length > 0) {
                const item = predictions[0].class;
                if (["person", "car", "bus", "dog", "bicycle"].includes(item)) {
                    talk("අවධානය ඉදිරියේ " + item);
                    if (navigator.vibrate) navigator.vibrate(200);
                }
            }
            setTimeout(detectObstacles, 2500);
        }

        // GPS සහ මගපෙන්වීමේ ලොජික් එක
        function updateNavigation(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            // මෙතනදී සර්ච් කරන ලොකේෂන් එකට ඇති දුර මනිනු ලබයි
            document.getElementById('nav').innerText = `ඔබ සිටින ස්ථානය: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        }
    </script>
</body>
</html>
