<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviAid Smart Vision 2.2</title>
    <style>
        body { margin: 0; background: #000; color: #00FF00; font-family: sans-serif; text-align: center; }
        .header { background: #111; padding: 15px; font-size: 22px; border-bottom: 2px solid #00FF00; font-weight: bold; }
        video { width: 100%; height: 45vh; object-fit: cover; border-bottom: 1px solid #333; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .btn { padding: 20px; border: none; border-radius: 15px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-smart { grid-column: span 2; background: #FFD700; color: #000; box-shadow: 0 4px #b89b00; }
        .btn-main { grid-column: span 2; background: #00FF00; color: #000; }
        .btn-blue { background: #007AFF; color: #fff; }
        .btn-red { background: #FF3B30; color: #fff; }
        #status { padding: 15px; font-weight: bold; color: #FFD700; background: #111; min-height: 40px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div class="header">NaviAid: ඩිජිටල් ඇස</div>
    <video id="cam" autoplay playsinline></video>
    <div id="status">පද්ධතිය සූදානම්...</div>

    <div class="controls">
        <button class="btn btn-main" onclick="startVision()">ඩිජිටල් ඇස පණගන්වන්න</button>
        <button class="btn btn-smart" onclick="checkClipboard()">Smart Open (ලින්ක් එක මෙතනට ගන්න)</button>
        <button class="btn btn-blue" onclick="window.location.href='google.navigation:q=0,0'">Maps</button>
        <button class="btn btn-blue" onclick="window.location.href='pickme://'">PickMe / Uber</button>
        <button class="btn btn-red" onclick="window.open('tel:119')">SOS (හදිසි ඇමතුම)</button>
        <button class="btn btn-blue" onclick="speak('කාලගුණය සෙල්සියස් අංශක 28යි. වැසි රහිතයි.')">Weather</button>
    </div>

    <script>
        // කැමරාව පණගැන්වීම
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(s => { document.getElementById('cam').srcObject = s; })
            .catch(e => { alert("කැමරාවට අවසර දෙන්න!"); });

        function speak(t) {
            let s = new SpeechSynthesisUtterance(t);
            s.lang = 'si-LK';
            window.speechSynthesis.speak(s);
            document.getElementById('status').innerText = t;
        }

        async function checkClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text.includes("maps") || text.includes("goo.gl")) {
                    speak("නව ගමනාන්තයක් හඳුනාගත්තා. මග පෙන්වීම සූදානම්.");
                    setTimeout(() => { window.open(text, '_blank'); }, 2000);
                } else {
                    speak("කරුණාකර WhatsApp ලින්ක් එක Copy කර මෙහි එන්න.");
                }
            } catch (err) {
                speak("ලින්ක් එක ගැනීමට අවසර (Paste Permission) ලබා දෙන්න.");
            }
        }

        function startVision() {
            speak("නිරීක්ෂණය අරඹයි. ඉදිරිය පැහැදිලියි. වම් පසින් බාධකයක් ඇත.");
        }
    </script>
</body>
</html>
