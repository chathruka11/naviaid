
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviAid AI Brain v6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        body { margin: 0; background: #000; color: #00FF00; font-family: sans-serif; text-align: center; }
        .header { background: #111; padding: 15px; font-size: 20px; border-bottom: 2px solid #00FF00; }
        #video-container { position: relative; width: 100%; height: 50vh; background: #222; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .status { padding: 20px; font-size: 18px; color: #FFD700; background: #111; min-height: 50px; }
        .btn { width: 90%; padding: 20px; margin: 10px; background: #00FF00; color: #000; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body onclick="startAI()">

    <div class="header">NAVIAID: AI පරිලෝකනය (Live)</div>
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div class="status" id="status-msg">AI මොළය පූරණය වෙමින්... ස්ක්‍රීන් එක ටැප් කරන්න.</div>
    <button class="btn">AI සහාය සක්‍රීයයි</button>

    <script>
        let model;
        let video = document.getElementById('webcam');
        let statusMsg = document.getElementById('status-msg');
        let isSpeaking = false;

        function speak(text) {
            if (isSpeaking) return;
            isSpeaking = true;
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'si-LK';
            msg.onend = () => { isSpeaking = false; };
            window.speechSynthesis.speak(msg);
            statusMsg.innerText = text;
        }

        async function startAI() {
            statusMsg.innerText = "කැමරාව සහ AI පණගැන්වේ...";
            
            // කැමරාව ලබා ගැනීම
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;

            // AI Model එක ලෝඩ් කිරීම
            statusMsg.innerText = "AI මොළය සූදානම් කරමින්... කරුණාකර රැඳී සිටින්න.";
            model = await cocoSsd.load();
            statusMsg.innerText = "AI සක්‍රීයයි! මම දැන් වටපිටාව නිරීක්ෂණය කරනවා.";
            speak("පද්ධතිය සූදානම්. මම දැන් වටපිටාව නිරීක්ෂණය කරනවා.");
            
            predict();
        }

        async function predict() {
            const predictions = await model.detect(video);
            
            if (predictions.length > 0) {
                let objectName = predictions[0].class;
                
                // ඉංග්‍රීසි නම් සිංහලට හැරවීම (පොඩි උදාහරණ කිහිපයක්)
                let translation = {
                    "person": "පුද්ගලයෙක් ඉදිරියෙන් සිටී",
                    "cell phone": "ජංගම දුරකථනයක් හඳුනාගත්තා",
                    "bottle": "බෝතලයක් තිබේ",
                    "chair": "පුටුවක් තිබේ",
                    "bed": "ඇඳක් හඳුනාගත්තා",
                    "laptop": "ලැප්ටොප් එකක් තිබේ"
                };

                let message = translation[objectName] || objectName + " හඳුනාගත්තා";
                speak(message);
            }

            requestAnimationFrame(predict); // දිගටම ස්කෑන් කරන්න
        }
    </script>
</body>
</html>
