<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviAid Original AI</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <style>
        body { margin: 0; background: #000; color: #00FF00; font-family: 'Segoe UI', sans-serif; text-align: center; }
        .header { background: #111; padding: 20px; font-size: 24px; border-bottom: 3px solid #00FF00; font-weight: bold; }
        video { width: 100%; height: 50vh; object-fit: cover; border-bottom: 2px solid #333; }
        .status-display { padding: 25px; font-size: 20px; color: #FFD700; background: #0a0a0a; min-height: 80px; }
        .ai-scanner { position: absolute; top: 15%; left: 0; width: 100%; height: 2px; background: rgba(0, 255, 0, 0.5); box-shadow: 0 0 15px #00FF00; animation: scan 3s infinite linear; }
        @keyframes scan { 0% { top: 15%; } 50% { top: 65%; } 100% { top: 15%; } }
        .action-area { padding: 20px; }
        .btn-start { width: 90%; padding: 25px; background: #00FF00; color: #000; border: none; border-radius: 50px; font-size: 22px; font-weight: bold; box-shadow: 0 5px 15px rgba(0, 255, 0, 0.3); }
    </style>
</head>
<body onclick="activateAI()">

    <div class="header">NAVIAID: ORIGINAL AI</div>
    <div class="ai-scanner"></div>
    <video id="cameraView" autoplay playsinline></video>
    <div class="status-display" id="output">පද්ධතිය සූදානම්. ආරම්භ කිරීමට ස්පර්ශ කරන්න.</div>
    
    <div class="action-area">
        <button class="btn-start" id="mainBtn">ඩිජිටල් ඇස පණගන්වන්න</button>
    </div>

    <script>
        let synth = window.speechSynthesis;
        let isRunning = false;

        function speak(text) {
            synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'si-LK';
            utterance.rate = 1.0;
            synth.speak(utterance);
            document.getElementById('output').innerText = text;
        }

        async function activateAI() {
            if (isRunning) return;
            isRunning = true;
            
            speak("NaviAid උසස් තාක්ෂණික පද්ධතිය පණගැන්වුණා. මම ඔබේ සහායට සූදානම්.");

            // කැමරාව පණගැන්වීම
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('cameraView').srcObject = stream;
            } catch (err) {
                speak("කැමරාව ක්‍රියාත්මක කිරීමට අවසර ලබා දෙන්න.");
            }

            // GPS ආරම්භය
            startNavigation();
        }

        function startNavigation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    // මෙතනදී ඇත්තම මගපෙන්වීම සිදුකළ හැක
                    checkRouteProgress(position.coords);
                }, null, { enableHighAccuracy: true });
            }
        }

        function checkRouteProgress(coords) {
            // උදාහරණයක් ලෙස පාරේ මීටර් ගණන හඳුනාගැනීම
            console.log("GPS Active: " + coords.latitude);
        }

        // වොයිස් ගයිඩ් එක දිගටම පවත්වා ගැනීම
        setInterval(() => {
            if (isRunning) {
                // මෙතනදී AI මගින් වටපිටාව ස්කෑන් කර විස්තර පවසනු ඇත
                // දැනට පද්ධතියේ සක්‍රීය බව පවසයි
            }
        }, 15000);

    </script>
</body>
</html>
